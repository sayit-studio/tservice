<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>活動簽到</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <h1>活動簽到</h1>
        </div>
        <div class="event-name-pill" id="eventNamePill" hidden>
          <strong id="eventNameText"></strong>
          <small id="eventDateText"></small>
        </div>
      </header>

      <section class="notice" id="notice" hidden></section>

      <form class="panel" id="registrationForm">
        <div class="panel-head">
          <h2 id="eventTitle">填寫簽到資料</h2>
          <p id="eventMeta">請確認資料正確，送出後服務團隊會收到簽到資訊。</p>
        </div>

        <input type="hidden" name="eventId" id="eventId" />
        <input type="hidden" name="lineUserId" id="lineUserId" />
        <input type="hidden" name="lineDisplayName" id="lineDisplayName" />

        <label class="field">
          <span>姓名</span>
          <input name="name" autocomplete="name" required maxlength="40" />
        </label>

        <label class="field">
          <span>電話</span>
          <input name="phone" inputmode="tel" autocomplete="tel" required maxlength="20" placeholder="09xxxxxxxx" />
        </label>

        <label class="field">
          <span>同行人數</span>
          <input name="companions" type="number" min="0" max="20" value="0" />
        </label>

        <label class="field">
          <span>備註</span>
          <textarea name="note" rows="4" maxlength="500" placeholder="可填寫特殊需求或補充說明"></textarea>
        </label>

        <p class="privacy-note">
          我們將保存您的姓名、LINE識別資訊及活動參與紀錄，用於活動聯繫、參與次數統計、活躍度分析與後續服務管理。
        </p>

        <button class="primary-action" type="submit">送出簽到</button>
      </form>
    </main>

    <div class="complete-layer" id="completeLayer" hidden>
      <section class="complete-box">
        <h2>簽到已送出</h2>
        <p id="completeText">服務團隊已收到您的簽到資料。</p>
        <button class="primary-action" id="closeButton" type="button">關閉</button>
      </section>
    </div>

    <script src="./config.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
