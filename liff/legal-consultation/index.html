<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>法律諮詢預約</title>
    <meta name="description" content="法律諮詢預約、查詢與取消" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <section class="topbar" aria-label="系統狀態">
        <div>
          <p class="eyebrow">LINE 法律諮詢</p>
          <h1>預約服務</h1>
        </div>
        <span class="status-pill" id="liffStatus">初始化中</span>
      </section>

      <nav class="mode-tabs" aria-label="功能切換">
        <button class="mode-tab is-active" type="button" data-mode="book">立即預約</button>
        <button class="mode-tab" type="button" data-mode="query">查詢</button>
        <button class="mode-tab" type="button" data-mode="cancel">取消</button>
      </nav>

      <section class="notice" id="notice" hidden></section>

      <form class="panel" id="bookingForm" data-form="book">
        <div class="panel-head">
          <h2>法律諮詢預約表單</h2>
          <p>週一、二、四、五為下午 3:00 至 4:00；週三為上午 10:00 至 11:00。每 15 分鐘一個名額。</p>
        </div>

        <label class="field">
          <span>姓名</span>
          <input name="name" autocomplete="name" required maxlength="40" placeholder="請輸入姓名" />
        </label>

        <label class="field">
          <span>連絡電話</span>
          <input name="phone" inputmode="tel" autocomplete="tel" required maxlength="20" placeholder="09xxxxxxxx" />
        </label>

        <div class="grid-2">
          <label class="field">
            <span>指定預約日期</span>
            <input name="appointmentDate" id="appointmentDate" type="date" required />
          </label>

          <label class="field">
            <span>指定預約時間</span>
            <select name="appointmentTime" id="appointmentTime" required>
              <option value="">請先選擇日期</option>
            </select>
          </label>
        </div>

        <p class="availability-summary" id="availabilitySummary">選擇日期後會顯示可預約時段。</p>

        <div class="grid-2">
          <label class="field">
            <span>諮詢類別</span>
            <select name="legalCategory" id="legalCategory" required>
              <option value="">請選擇諮詢類別</option>
              <option>民事</option>
              <option>刑事</option>
              <option>行政訴訟</option>
              <option>家事</option>
              <option>勞資糾紛</option>
              <option>消費糾紛</option>
              <option>強制執行</option>
            </select>
          </label>

          <label class="field">
            <span>細項</span>
            <select name="legalItem" id="legalItem" required>
              <option value="">請先選擇諮詢類別</option>
            </select>
          </label>
        </div>

        <label class="field" id="legalOtherField" hidden>
          <span>其它項目補充</span>
          <input name="legalOtherItem" maxlength="80" placeholder="請補充說明其它項目名稱" />
        </label>

        <label class="field">
          <span>案件詳細說明</span>
          <textarea name="statement" rows="5" required maxlength="1200" placeholder="請描述需要諮詢的案件內容。"></textarea>
        </label>

        <label class="field">
          <span>1999案號</span>
          <input name="case1999" maxlength="80" placeholder="若無可留空" />
        </label>

        <label class="field">
          <span>提供照片資訊</span>
          <input name="photoFiles" type="file" accept="image/*" multiple />
          <small>可上傳與案件相關的照片，單檔建議 20MB 以下。</small>
        </label>

        <label class="field">
          <span>上傳案件文件</span>
          <input name="caseFiles" type="file" multiple />
          <small>可上傳 PDF、圖片或其他案件文件，單檔建議 20MB 以下。</small>
        </label>

        <label class="checkline">
          <input name="consent" type="checkbox" required />
          <span>我同意由服務團隊透過 LINE 或電話聯繫預約事宜。</span>
        </label>

        <button class="primary-action" type="submit">送出預約</button>
      </form>

      <form class="panel" id="queryForm" data-form="query" hidden>
        <div class="panel-head">
          <h2>預約資訊查詢</h2>
          <p>請輸入預約諮詢編號查詢目前預約狀態。</p>
        </div>

        <label class="field">
          <span>預約諮詢編號</span>
          <input name="appointmentId" required maxlength="40" placeholder="例如 1150522001" />
        </label>

        <button class="primary-action" type="submit">查詢預約</button>
      </form>

      <form class="panel" id="cancelForm" data-form="cancel" hidden>
        <div class="panel-head">
          <h2>取消預約</h2>
          <p>取消後系統會通知服務同仁。</p>
        </div>

        <label class="field">
          <span>預約諮詢編號</span>
          <input name="appointmentId" required maxlength="40" placeholder="例如 1150522001" />
        </label>

        <label class="field">
          <span>取消原因</span>
          <textarea name="reason" rows="4" maxlength="300" placeholder="可選填"></textarea>
        </label>

        <button class="danger-action" type="submit">取消預約</button>
      </form>
    </main>

    <div class="complete-layer" id="completeLayer" hidden>
      <section class="complete-box">
        <div class="complete-icon">✓</div>
        <h2 id="completeTitle">已送出</h2>
        <p id="completeText">請回到 LINE 查看後續通知。</p>
        <button class="primary-action" id="closeButton" type="button">關閉頁面</button>
      </section>
    </div>

    <script src="./config.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
