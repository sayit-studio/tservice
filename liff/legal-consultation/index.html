<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>法律諮詢預約系統</title>
    <meta name="description" content="法律諮詢立即預約、預約查詢與取消預約" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <section class="topbar" aria-label="系統狀態">
        <div>
          <p class="eyebrow">LINE 法律諮詢</p>
          <h1>預約服務</h1>
        </div>
        <span class="status-pill" id="liffStatus">初始化中</span>
      </section>

      <nav class="mode-tabs" aria-label="功能切換">
        <button class="mode-tab is-active" type="button" data-mode="book">立即預約</button>
        <button class="mode-tab" type="button" data-mode="query">查詢</button>
        <button class="mode-tab" type="button" data-mode="cancel">取消</button>
      </nav>

      <section class="notice" id="notice" hidden></section>

      <form class="panel" id="bookingForm" data-form="book">
        <div class="panel-head">
          <h2>立即預約法律諮詢</h2>
          <p>預約時段為週一至週五，自下午 3 點起，每 15 分鐘一個預約點。</p>
        </div>

        <label class="field">
          <span>陳情人姓名</span>
          <input name="name" autocomplete="name" required maxlength="40" placeholder="請輸入姓名" />
        </label>

        <label class="field">
          <span>聯絡電話</span>
          <input name="phone" inputmode="tel" autocomplete="tel" required maxlength="20" placeholder="09xxxxxxxx" />
        </label>

        <div class="grid-2">
          <label class="field">
            <span>預約日期</span>
            <input name="appointmentDate" id="appointmentDate" type="date" required />
          </label>

          <label class="field">
            <span>預約時間</span>
            <select name="appointmentTime" id="appointmentTime" required>
              <option value="">請先選擇日期</option>
            </select>
          </label>
        </div>

        <p class="availability-summary" id="availabilitySummary">選擇日期後會顯示可預約時段。</p>

        <div class="grid-2">
          <label class="field">
            <span>&#x6cd5;&#x6276;&#x9805;&#x76ee;</span>
            <select name="legalCategory" id="legalCategory" required>
              <option value="">&#x8acb;&#x9078;&#x64c7;&#x6cd5;&#x6276;&#x9805;&#x76ee;</option>
              <option>&#x6c11;&#x4e8b;</option>
              <option>&#x5211;&#x4e8b;</option>
              <option>&#x884c;&#x653f;&#x8a34;&#x8a1f;</option>
              <option>&#x5bb6;&#x4e8b;</option>
              <option>&#x52de;&#x8cc7;&#x7cfe;&#x7d1b;</option>
              <option>&#x6d88;&#x8cbb;&#x7cfe;&#x7d1b;</option>
              <option>&#x5f37;&#x5236;&#x57f7;&#x884c;</option>
            </select>
          </label>

          <label class="field">
            <span>&#x7d30;&#x9805;</span>
            <select name="legalItem" id="legalItem" required>
              <option value="">&#x8acb;&#x5148;&#x9078;&#x64c7;&#x6cd5;&#x6276;&#x9805;&#x76ee;</option>
            </select>
          </label>
        </div>

        <label class="field" id="legalOtherField" hidden>
          <span>&#x5176;&#x5b83;&#x9805;&#x76ee;&#x88dc;&#x5145;</span>
          <input name="legalOtherItem" maxlength="80" placeholder="&#x8acb;&#x88dc;&#x5145;&#x8aaa;&#x660e;&#x5176;&#x5b83;&#x9805;&#x76ee;&#x540d;&#x7a31;" />
        </label>

        <label class="field">
          <span>簡單事件陳述</span>
          <textarea name="statement" rows="5" required maxlength="800" placeholder="請簡述需要諮詢的事件。"></textarea>
        </label>

        <label class="checkline">
          <input name="consent" type="checkbox" required />
          <span>我同意由服務團隊透過 LINE 或電話聯繫預約事宜。</span>
        </label>

        <button class="primary-action" type="submit">送出預約</button>
      </form>

      <form class="panel" id="queryForm" data-form="query" hidden>
        <div class="panel-head">
          <h2>預約資訊查詢</h2>
          <p>查詢結果將由 LINE OA 回覆，例如「您已預約成功，日期與時間如下」。</p>
        </div>

        <label class="field">
          <span>預約編號</span>
          <input name="appointmentId" required maxlength="40" placeholder="例如 LAW-20260423-001" />
        </label>

        <button class="primary-action" type="submit">查詢預約</button>
      </form>

      <form class="panel" id="cancelForm" data-form="cancel" hidden>
        <div class="panel-head">
          <h2>取消預約</h2>
          <p>民眾取消預約後，系統會主動通知服務同仁。</p>
        </div>

        <label class="field">
          <span>預約編號</span>
          <input name="appointmentId" required maxlength="40" placeholder="例如 LAW-20260423-001" />
        </label>

        <label class="field">
          <span>取消原因</span>
          <textarea name="reason" rows="4" maxlength="300" placeholder="可選填"></textarea>
        </label>

        <button class="danger-action" type="submit">取消預約</button>
      </form>
    </main>

    <div class="complete-layer" id="completeLayer" hidden>
      <section class="complete-box">
        <div class="complete-icon">✓</div>
        <h2 id="completeTitle">已送出</h2>
        <p id="completeText">請回到 LINE 查看後續通知。</p>
        <button class="primary-action" id="closeButton" type="button">關閉頁面</button>
      </section>
    </div>

    <script src="./config.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
